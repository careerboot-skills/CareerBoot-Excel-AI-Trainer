<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerBoot - Premium Excel Learning Hub</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.4);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(15, 23, 42, 0.75);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Common Page View Layout */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .page.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Nav for Page 3 & Page 4 */
    .nav-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .nav-header .left-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .breadcrumb {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .breadcrumb span {
      color: var(--primary);
      font-weight: 600;
    }

    /* Page 1 Layout */
    #page1 {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    /* Section 1: 35% Height */
    .p1-section-1 {
      height: 35vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.5rem;
    }

    .logo-svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 10px var(--primary-glow));
    }

    .logo-title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-note {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Walking Animation Track */
    .walk-track-container {
      width: 80%;
      max-width: 700px;
      position: relative;
      margin-top: 5px;
    }

    .track-labels {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .label-start { color: #f59e0b; }
    .label-end { color: var(--primary); }

    .track-line {
      height: 6px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .track-line-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
    }

    .walking-man {
      position: absolute;
      top: -28px;
      left: 0%;
      font-size: 1.6rem;
      transform: translateX(-50%);
      animation: walkAcross 12s linear infinite;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6));
    }

    @keyframes walkAcross {
      0% { left: 0%; transform: translateX(-50%) scaleX(1); }
      48% { left: 95%; transform: translateX(-50%) scaleX(1); }
      50% { left: 95%; transform: translateX(-50%) scaleX(-1); }
      98% { left: 0%; transform: translateX(-50%) scaleX(-1); }
      100% { left: 0%; transform: translateX(-50%) scaleX(1); }
    }

    /* Section 2: 15% Height */
    .p1-section-2 {
      height: 15vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      background: rgba(15, 23, 42, 0.5);
      position: relative;
      z-index: 10;
    }

    .key-box-wrapper {
      display: flex;
      gap: 10px;
      background: rgba(30, 41, 59, 0.9);
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      position: relative;
      max-width: 500px;
      width: 100%;
    }

    .key-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      padding: 8px 12px;
      font-weight: 600;
    }

    .simsim-btn {
      background: linear-gradient(135deg, var(--primary), #059669);
      color: #fff;
      border: none;
      padding: 0.7rem 1.3rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .simsim-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    /* Section 3: Rest of Screen (50% Height) */
    .p1-section-3 {
      height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.5) 0%, transparent 70%);
    }

    .man-computer-scene {
      width: 280px;
      height: 220px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .computer-screen {
      width: 180px;
      height: 120px;
      background: #1e293b;
      border: 4px solid #475569;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s ease;
      overflow: hidden;
    }

    .computer-screen-content {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      padding: 10px;
    }

    .computer-stand {
      width: 30px;
      height: 20px;
      background: #334155;
    }

    .computer-base {
      width: 80px;
      height: 8px;
      background: #475569;
      border-radius: 4px;
    }

    .seated-man {
      font-size: 3.5rem;
      position: absolute;
      bottom: 0px;
      right: 20px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }

    /* Flying Cloud Element for Animation */
    .flying-cloud {
      position: fixed;
      z-index: 999;
      font-size: 2.2rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8));
      transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
    }

    .flying-cloud-text {
      position: absolute;
      font-size: 0.75rem;
      font-weight: 800;
      color: #0f172a;
      background: #fff;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Screen Indications */
    .screen-green {
      background: #10b981 !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 35px #10b981 !important;
      color: #fff !important;
    }

    .screen-red {
      background: #ef4444 !important;
      border-color: #f87171 !important;
      box-shadow: 0 0 35px #ef4444 !important;
      color: #fff !important;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Page 2: Dashboard */
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      width: 100%;
    }

    .dashboard-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .dashboard-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .dash-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.8rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    .dash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .dash-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .dash-card:hover::before {
      opacity: 1;
    }

    .dash-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--primary);
    }

    .dash-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
    }

    /* Page 3: Sub-Categories Grid */
    .content-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      width: 100%;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 2rem;
      color: #fff;
    }

    .subcat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .subcat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .subcat-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .subcat-num {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .subcat-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .subcat-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Page 4: Detailed Topics View */
    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .topic-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .topic-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .topic-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .topic-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .detail-block {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .detail-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
    }

    .detail-text {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .code-box {
      background: #090d16;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .result-tag {
      display: inline-block;
      margin-top: 0.5rem;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .logo-title { font-size: 1.4rem; }
      .p1-section-1 { height: 40vh; }
      .p1-section-2 { height: 20vh; }
      .p1-section-3 { height: 40vh; }
      .dashboard-header h1 { font-size: 1.8rem; }
      .topic-card { padding: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- PAGE 1: Login & Interactive Animation -->
  <div id="page1" class="page active">
    <!-- 35% Height: CareerBoot SVG & Walk Animation -->
    <div class="p1-section-1">
      <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
          <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#logoGrad)"/>
          <path d="M30 65 L45 35 L55 50 L70 30" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <h1 class="logo-title">CareerBoot</h1>
      </div>
      <p class="welcome-note">Welcome to Premier Interactive Excel Learning Hub</p>

      <div class="walk-track-container">
        <div class="track-labels">
          <span class="label-start"><i class="fa-solid fa-lightbulb"></i> Interest</span>
          <span class="label-end"><i class="fa-solid fa-trophy"></i> Success</span>
        </div>
        <div class="track-line">
          <div class="track-line-fill"></div>
        </div>
        <div class="walking-man" id="walkingMan">🚶‍♂️</div>
      </div>
    </div>

    <!-- 15% Height: Secret Key Form -->
    <div class="p1-section-2">
      <div class="key-box-wrapper" id="keyBoxWrapper">
        <input type="password" id="secretKeyInput" class="key-input" placeholder="Enter Secret Key..." autocomplete="off">
        <button id="simsimBtn" class="simsim-btn">
          <span>khul ja sim sim</span>
          <i class="fa-solid fa-key"></i>
        </button>
      </div>
    </div>

    <!-- Rest of Screen (50% Height): Man Seated in front of Computer -->
    <div class="p1-section-3">
      <div class="man-computer-scene">
        <div class="computer-screen" id="pcScreen">
          <div class="computer-screen-content" id="pcScreenText">
            <i class="fa-solid fa-desktop" style="font-size: 1.8rem; margin-bottom: 4px;"></i>
            <div>AWAITING KEY...</div>
          </div>
        </div>
        <div class="computer-stand"></div>
        <div class="computer-base"></div>
        <div class="seated-man">👨‍💻</div>
      </div>
    </div>
  </div>

  <!-- PAGE 2: MAIN DASHBOARD -->
  <div id="page2" class="page">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h1>MAIN DASHBOARD</h1>
        <p class="breadcrumb">Select a module to begin your learning journey</p>
      </div>
      <div class="dashboard-grid" id="dashboardGrid">
        <!-- Cards generated dynamically via JavaScript -->
      </div>
    </div>
  </div>

  <!-- PAGE 3: SUB-CATEGORY GRID -->
  <div id="page3" class="page">
    <div class="nav-header">
      <div class="left-group">
        <button class="nav-btn" id="p3BackBtn"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <button class="nav-btn" id="p3HomeBtn"><i class="fa-solid fa-house"></i> Home</button>
      </div>
      <div class="breadcrumb">Dashboard > <span id="p3BreadcrumbCategory">Category</span></div>
    </div>
    <div class="content-wrapper">
      <h2 class="page-title" id="p3CategoryTitle">Category Title</h2>
      <div class="subcat-grid" id="subcatGrid">
        <!-- Subcategories dynamically loaded -->
      </div>
    </div>
  </div>

  <!-- PAGE 4: DETAILED TOPICS VIEW -->
  <div id="page4" class="page">
    <div class="nav-header">
      <div class="left-group">
        <button class="nav-btn" id="p4BackBtn"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <button class="nav-btn" id="p4HomeBtn"><i class="fa-solid fa-house"></i> Home</button>
      </div>
      <div class="breadcrumb">Dashboard > <span id="p4BreadcrumbCategory">Category</span> > <span id="p4BreadcrumbSubcat">Subcategory</span></div>
    </div>
    <div class="content-wrapper">
      <h2 class="page-title" id="p4SubcatTitle">Subcategory Breakdown</h2>
      <div class="topic-list" id="topicList">
        <!-- Detailed topic breakdown cards dynamically loaded -->
      </div>
    </div>
  </div>

  <!-- Link External JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
